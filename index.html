<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мир котиков</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E3F3EE;--ink:#10332E;--mut:#4A6B66;--card:#fff;--acc:#FF7A59;--line:#BFDDD4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F2623;--ink:#E8F7F3;--mut:#92B9B1;--card:#173733;--line:#25504A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F2623;--ink:#E8F7F3;--mut:#92B9B1;--card:#173733;--line:#25504A;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.55}
main{max-width:1000px;margin:0 auto;padding:40px 20px 64px}
h1,h2{font-family:Fredoka,system-ui,sans-serif;margin:0;line-height:1.1}
h1{font-size:clamp(40px,8vw,72px);font-weight:700}
h1 span{display:inline-block;background:var(--acc);color:#10332E;padding:0 .25em;border-radius:.35em;transform:rotate(-3deg)}
.lead{color:var(--mut);max-width:34em;margin:14px 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;display:block;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-4px);border-color:var(--acc)}
.card:focus-visible,.back:focus-visible,.tile:focus-visible,.x:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.card svg,.tile svg{display:block;width:100%;height:auto}
.card img,.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
dialog img{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000}
.card b{display:block;font-family:Fredoka,sans-serif;font-size:19px;font-weight:500;padding:12px 16px 2px}
.card small{display:block;padding:0 16px 14px;color:var(--mut);font-size:14px}
.back{all:unset;cursor:pointer;font-weight:700;color:var(--mut);padding:6px 0;margin-bottom:18px;display:inline-block}
.back:hover{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 28px;padding:0;list-style:none}
.facts li{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 16px;font-size:15px}
.tile{all:unset;box-sizing:border-box;cursor:zoom-in;display:block;border-radius:20px;overflow:hidden;transition:transform .15s}
.tile:hover{transform:scale(1.03) rotate(-1deg)}
.tile .nm{display:block;padding:10px 14px;background:var(--card);font-family:Fredoka,sans-serif;font-size:19px;font-weight:500;text-align:center}
dialog{border:0;padding:0;border-radius:26px;background:var(--card);color:var(--ink);width:min(92vw,520px);overflow:hidden}
dialog::backdrop{background:rgba(6,24,21,.75)}
dialog svg{display:block;width:100%;height:auto}
dialog p{margin:0;padding:14px 20px 18px;font-family:Fredoka,sans-serif;font-size:20px}
.x{all:unset;cursor:pointer;position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--card);text-align:center;line-height:40px;font-size:20px;font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
 <section id="home">
  <h1>Мир <span>котиков</span></h1>
  <p class="lead">Выберите породу, и откроется галерея котиков. Нажмите на любого, чтобы рассмотреть поближе.</p>
  <div class="grid" id="breeds"></div>
 </section>
 <section id="detail" hidden>
  <button class="back" id="back">← Все породы</button>
  <h2 id="dname" style="font-size:clamp(34px,6vw,56px)"></h2>
  <p class="lead" id="ddesc" style="margin-bottom:0"></p>
  <ul class="facts" id="dfacts"></ul>
  <div class="grid" id="gallery"></div>
 </section>
</main>
<dialog id="dlg"><button class="x" id="close" aria-label="Закрыть">×</button><div id="big"></div><p id="cap"></p></dialog>

{id:'home',name:'Усатый-полосатый',real:1,fur:'#D9CFC3',pat:'tabby',pc:'#6B5A4A',eye:'#7DB85A',w:1,ear:.6,desc:'Самые обычные и самые любимые коты: окрасы бывают любые, а характер у каждого свой. Сюда попадают котики подписчиков, чьи породы определить не получилось 😿',origin:'Весь мир',weight:'самый разный',trait:'у каждого свой'}
];
BREEDS.unshift(BREEDS.splice(BREEDS.findIndex(b=>b.id==='home'),1)[0]);
const NAMES=['Мурзик','Пушинка','Барсик','Соня','Персик','Лапочка'];
const BGS=['#FFD6C9','#FFE9A8','#CDE9F5','#E6D5F2','#CFEFD9','#F8CFE0'];
let uid=0;
function cat(b,v){
 const id='c'+(uid++),w=b.w,hx=60*w,f=b.fur,pc=b.pc||'#444';
 const mode=['o','h','o','s','o','h'][v],tilt=[0,-6,5,0,-4,6][v],acc=[0,1,0,2,0,3][v];
 const ear=(c)=>{
  const tip=b.fold?[100-hx*.62,70]:[100-hx*.72,50-b.ear*13];
  const inner=b.fold?'':`<polygon points="${100-hx*.85},88 ${tip[0]+1},${tip[1]+12} ${100-hx*.38},70" fill="#F4A9B8" opacity=".75"/>`;
  return `<polygon points="${100-hx*.98},96 ${tip[0]},${tip[1]} ${100-hx*.18},64" fill="${c}"/>${inner}`};
 const ec=(b.pat==='point')?pc:f;
 let s=`<svg viewBox="0 0 200 200" role="img" aria-label="${b.name}, котик ${NAMES[v]}"><defs><clipPath id="${id}"><ellipse cx="100" cy="112" rx="${hx}" ry="50"/></clipPath></defs><rect width="200" height="200" fill="${BGS[v]}"/><g transform="rotate(${tilt} 100 160)">`;
 s+=`<ellipse cx="100" cy="192" rx="${52*w}" ry="42" fill="${f}"/>`;
 s+=ear(ec)+`<g transform="translate(200 0) scale(-1 1)">${ear(ec)}</g>`;
 if(b.fluff)for(let i=0;i<14;i++){const a=i/14*6.283;s+=`<circle cx="${100+(hx+1)*Math.cos(a)}" cy="${112+51*Math.sin(a)}" r="9" fill="${f}"/>`}
 s+=`<ellipse cx="100" cy="112" rx="${hx}" ry="50" fill="${f}"/><g clip-path="url(#${id})">`;
 if(b.pat==='tabby')s+=`<g stroke="${pc}" stroke-width="4" stroke-linecap="round" fill="none"><path d="M100 62v16M88 64l3 14M112 64l-3 14"/><path d="M${100-hx} 108h16M${100-hx} 120h14M${100+hx} 108h-16M${100+hx} 120h-14"/></g>`;
 if(b.pat==='spots')[[78,76],[124,80],[100,70],[58,112],[144,110],[70,140],[132,142]].forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${pc}"/><circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="#B47A2A"/>`);
 if(b.pat==='point')s+=`<ellipse cx="100" cy="124" rx="${34}" ry="28" fill="${pc}" opacity=".85"/>`;
 if(b.pat==='wrinkle')s+=`<g stroke="${pc}" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M76 74q24-8 48 0M72 84q28-8 56 0M80 94q20-6 40 0"/></g>`;
 s+=`</g><ellipse cx="100" cy="132" rx="21" ry="14" fill="${b.muz||'#fff'}" opacity="${b.muz?1:.35}"/>`;
 [-1,1].forEach(d=>{
  const x=100+d*hx*.45,y=104;
  if(mode==='o')s+=`<ellipse cx="${x}" cy="${y}" rx="9" ry="10" fill="${b.eye}"/><ellipse cx="${x}" cy="${y}" rx="3" ry="8" fill="#111"/><circle cx="${x+3}" cy="${y-4}" r="2.5" fill="#fff"/>`;
  else if(mode==='h')s+=`<path d="M${x-8} ${y+3}Q${x} ${y-10} ${x+8} ${y+3}" stroke="#2a2020" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else s+=`<path d="M${x-8} ${y}Q${x} ${y+8} ${x+8} ${y}" stroke="#2a2020" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M${100+d*22} 131L${100+d*(hx+16)} 125M${100+d*22} 135L${100+d*(hx+16)} 137" stroke="#3a3a4a" stroke-width="1.5" opacity=".45"/>`;
 });
 s+=`<path d="M94 122h12l-6 7z" fill="#E88A9A"/><path d="M100 129v4M100 133q-6 6-12 2M100 133q6 6 12 2" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>`;
 if(acc===1)s+=`<g fill="#E0566E"><polygon points="100,166 80,156 80,176"/><polygon points="100,166 120,156 120,176"/><circle cx="100" cy="166" r="5"/></g>`;
 if(acc===2)s+=`<path d="M${100-38*w} 162Q100 180 ${100+38*w} 162" stroke="#3B6FD6" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="100" cy="176" r="6" fill="#F2B632"/>`;
 if(acc===3){const fx=100-hx*.55,fy=70;for(let i=0;i<5;i++){const a=i/5*6.283;s+=`<circle cx="${fx+6*Math.cos(a)}" cy="${fy+6*Math.sin(a)}" r="4.5" fill="#F58BA8"/>`}s+=`<circle cx="${fx}" cy="${fy}" r="3.5" fill="#F2B632"/>`}
 return s+`</g></svg>`;
}
const $=i=>document.getElementById(i),dlg=$('dlg');
$('breeds').innerHTML=BREEDS.map((b,i)=>`<button class="card" data-i="${i}">${PHOTOS[b.id]?imgTag(PHOTOS[b.id][0],b):cat(b,i%6)}<b>${b.name}</b><small>${b.trait}</small></button>`).join('');
function items(b){
 const ph=(PHOTOS[b.id]||[]).map(p=>({html:imgTag(p,b),name:p.name,cap:p.name?`${p.name}, ${b.name.toLowerCase()}`:b.name}));
 return ph.concat(b.real?[]:NAMES.map((n,v)=>({html:cat(b,v),cap:`${n}, ${b.name.toLowerCase()}`})));
}
function show(i){
 const b=BREEDS[i];
 $('dname').textContent=b.name;$('ddesc').textContent=b.desc;
 $('dfacts').innerHTML=[`Родина: ${b.origin}`,`Вес: ${b.weight}`,`Характер: ${b.trait}`].map(t=>`<li>${t}</li>`).join('');
 $('gallery').innerHTML=items(b).map((it,k)=>`<button class="tile" data-i="${i}" data-k="${k}" aria-label="Открыть: ${it.cap}">${it.html}${it.name?`<span class="nm">${it.name}</span>`:''}</button>`).join('');
 $('home').hidden=true;$('detail').hidden=false;window.scrollTo(0,0);
}
$('breeds').onclick=e=>{const c=e.target.closest('.card');if(c)show(+c.dataset.i)};
$('back').onclick=()=>{$('detail').hidden=true;$('home').hidden=false;window.scrollTo(0,0)};
$('gallery').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;
 const it=items(BREEDS[+t.dataset.i])[+t.dataset.k];
 $('big').innerHTML=it.html;$('cap').textContent=it.cap;dlg.showModal()};
$('close').onclick=()=>dlg.close();
dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
</script>
</body>
</html>
